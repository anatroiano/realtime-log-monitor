x-spring-kafka: &spring-kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

services:
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - log-monitor-network
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  log-collector-service:
    image: realtime-log-monitor-collector
    build:
      context: ./log-collector-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *spring-kafka
    networks:
      - log-monitor-network
    depends_on:
      kafka:
        condition: service_healthy

  log-processor-service:
    image: realtime-log-monitor-processor
    build:
      context: ./log-processor-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *spring-kafka
      PROCESSOR_APPLICATION_ID: log-processor-v1
      PROCESSOR_GRACE_PERIOD: 5m
      PROCESSOR_DEDUPLICATION_RETENTION: 24h
      PROCESSOR_OUTPUT_RETENTION: 7d
      PROCESSOR_TOPIC_PARTITIONS: 3
      PROCESSOR_REPLICATION_FACTOR: 1
    volumes:
      - processor-state:/app/data
    networks:
      - log-monitor-network
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?set GRAFANA_DB_USER in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - log-monitor-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10

  alert-service:
    image: realtime-log-monitor-alert
    build:
      context: ./alert-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *spring-kafka
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ALERT_WEBHOOK_ENABLED: "true"
      ALERT_WEBHOOK_URL: http://webhook-receiver:8080/alerts
    networks:
      - log-monitor-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  webhook-receiver:
    image: mendhak/http-https-echo:37
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
    networks:
      - log-monitor-network

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - log-monitor-network

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?set GRAFANA_DB_USER in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - log-monitor-network
    depends_on:
      - prometheus
      - postgres

  tests:
    profiles: [ "test" ]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    entrypoint:
      - sh
      - -c
      - >-
        tar -C /source --exclude=.git --exclude=target --exclude=.env --exclude=./scripts
        --exclude=./log-processor-service/data -cf - . | tar -xf - &&
        exec mvn -B "$$@"
      - mvn
    command: [ "clean", "test", "-Pkafka-integration" ]
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - .:/source:ro
      - maven-repository:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  kafka-data:
  processor-state:
  postgres-data:
  prometheus-data:
  grafana-data:
  maven-repository:

networks:
  log-monitor-network:
    driver: bridge
