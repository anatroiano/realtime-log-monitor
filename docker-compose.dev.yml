services:
  log-collector-service:
    image: realtime-log-monitor-collector-dev
    build:
      dockerfile: Dockerfile-dev
    ports:
      - "127.0.0.1:5005:5005"
    volumes:
      - ./log-collector-service/src:/app/src:ro
      - maven-repository:/root/.m2

  log-processor-service:
    image: realtime-log-monitor-processor-dev
    build:
      dockerfile: Dockerfile-dev
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - ./log-processor-service/src:/app/src:ro
      - maven-repository:/root/.m2

  alert-service:
    image: realtime-log-monitor-alert-dev
    build:
      dockerfile: Dockerfile-dev
    ports:
      - "127.0.0.1:5007:5007"
    volumes:
      - ./alert-service/src:/app/src:ro
      - maven-repository:/root/.m2

volumes:
  maven-repository:
